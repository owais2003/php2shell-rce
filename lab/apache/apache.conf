ServerRoot "/tmp/php2shell/apache"
PidFile "/tmp/php2shell/apache/apache.pid"
ErrorLog "/tmp/php2shell/apache/error.log"
LogLevel info

LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule env_module /usr/lib/apache2/modules/mod_env.so
LoadModule php_module /usr/lib/apache2/modules/libphp8.4.so

TypesConfig /etc/mime.types
ServerName 127.0.0.1

Listen 8091

<Directory /tmp/php2shell/www>
    AllowOverride None
    Require all granted
    <FilesMatch ".+\.ph(?:ar|p|tml)$">
        SetHandler application/x-httpd-php
    </FilesMatch>
</Directory>
<Directory /tmp/php2shell/www/seed>
    php_value session.serialize_handler php_serialize
    php_value session.upload_progress.cleanup 0
</Directory>
<Directory /tmp/php2shell/www/fire>
    php_value session.serialize_handler php
</Directory>

<VirtualHost *:8091>
    DocumentRoot /tmp/php2shell/www
</VirtualHost>

php_value session.save_path /var/lib/php/sessions
